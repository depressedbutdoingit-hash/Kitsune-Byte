name: "CodeQL Android config"

# Only analyze these paths (recommended for Flutter)
paths:
  - android/
  - '**/android/'          # plugins that ship Android code

# Explicitly ignore Flutter/Dart and generated noise
paths-ignore:
  - '**/*.dart'
  - '**/*.g.dart'
  - '**/*.freezed.dart'
  - '**/build/'
  - '**/.dart_tool/'
  - '**/ios/'
  - '**/macos/'
  - '**/linux/'
  - '**/windows/'
  - '**/web/'
  - 'docs/'
  - '**/*.md'
  - '**/test/'
  - '**/tests/'

# queries:
#   - uses: security-extendedconfig-file: .github/codeql/codeql-config.yml